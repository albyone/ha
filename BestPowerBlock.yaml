blueprint:
  name: Best forecast power price
  description: Returns the best average block of power. The block size is variable. You can ask for the minimum or maximum.
  domain: script

fields:
  entity_id:
    name: Amber Forecast Price
    description: The Amber price forecast sensor to use. If in doubt, use the general forecast.
    required: true
    selector:
      entity:
        integration: amberelectric
        domain: sensor

  block_size:
    name: Block size
    description: The size of the block in hours.
    required: true
    default: 1
    selector:
      number:
        min: 0.5
        max: 24
        step: 0.5

  min_max:
    name: Cheapest or most expensive?
    description: Would you like to see the cheapest or most expensive block?
    default: min
    required: true
    selector:
      select:
        options:
          - label: Cheapest
            value: min
          - label: Most expensive
            value: max

sequence:
  - variables:
      # Get all forecast data with duration and price
      forecast_data: "{{ state_attr(entity_id, 'forecasts') }}"
      
      # Group by start_time to handle variable durations
      grouped_prices: >
        {% set result = namespace(prices=[], current_time='', current_price=0, current_duration=0) %}
        {% set price_list = [] %}
        
        {% for item in forecast_data %}
#          {% set duration_hours = 60 / item.duration %}
#          {% set price_per_hour = item.per_kwh * duration_hours %}
          
          {# Group 5-minute intervals into 30-minute blocks #}
          {% if item.duration == 5 %}
            {% if result.current_time == '' %}
              {% set result.current_time = item.start_time %}
              {% set result.current_price = item.per_kwh %}
              {% set result.current_duration = item.duration %}
            {% else %}
              {% set result.current_price = result.current_price + item.per_kwh %}
              {% set result.current_duration = result.current_duration + item.duration %}
              
              {# When we hit 30 minutes (0.5 hours), store the average #}
              {% if result.current_duration == 30 %}
                {% set avg_price = result.current_price / 6 %}
                {% set price_list = price_list + [avg_price] %}
                {% set result.current_time = '' %}
                {% set result.current_price = 0 %}
                {% set result.current_duration = 0 %}
              {% endif %}
            {% endif %}
          {% else %}
            {# For 30-minute intervals, add directly #}
            {% set price_list = price_list + [item.per_kwh] %}
          {% endif %}
        {% endfor %}
        
        {{ price_list }}

      intervals: "{{ (block_size * 2) | int }}"
      
      averages: >
        {% set data = namespace(averages=[]) %}  
        {% if (grouped_prices|count) >= intervals %}
          {% for index in range((grouped_prices|count) - intervals + 1) %}
            {% set data.averages = data.averages + [(grouped_prices[index:index+intervals] | average)] %}
          {% endfor %} 
        {% endif %}
        {{ data.averages }}
        
      interval_index: >
        {% if averages and averages|count > 0 %}
          {% if min_max == "max" %}
            {{ averages.index(averages | max) }}
          {% else %}  
            {{ averages.index(averages | min) }}
          {% endif %}
        {% else %}
          0
        {% endif %}
        
      price: "{{ (averages[interval_index] * 100) | round | int if averages and interval_index < averages|count else 0 }}"
      
      response:
        block_size: "{{ block_size }}"
        starts_in_hours: "{{ (interval_index / 2) | round(1) }}"
        cents_per_kwh: "{{ price }}"
        min_max: >
          {% if min_max == "max" %}
            max
          {% else %}
            min
          {% endif %}
        total_intervals_available: "{{ grouped_prices|count }}"
        intervals_used: "{{ intervals }}"
        
  - stop: Returning values
    response_variable: response
